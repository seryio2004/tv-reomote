services:
  tv-reomote:
    build: .
    container_name: tv-reomote
    restart: unless-stopped
    network_mode: host
    user: "${TV_REMOTE_UID:-1000}:${TV_REMOTE_GID:-1000}"
    environment:
      BROWSER_CDP_URL: http://127.0.0.1:9222
      HOME_URL: https://www.youtube.com/
      YDOTOOL_SOCKET: /run/tv-remote/ydotool.sock
    volumes:
      - type: bind
        source: ./runtime/ydotool.sock
        target: /run/tv-remote/ydotool.sock
        bind:
          create_host_path: false
