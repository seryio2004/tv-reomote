<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TV Reomote</title><link rel="stylesheet" href="/static/css/remote.css?v=fullscreen-1"></head><body><main class="app">
<header class="topbar"><div><div class="eyebrow">BROWSER REMOTE</div><h1>TV Reomote</h1></div><div class="connection-list"><div id="connection" class="status offline">Chrome desconectado</div><div id="input-connection" class="status offline">Control desconectado</div></div></header>
<section class="card"><div class="navrow"><button data-action="back">←</button><button data-action="forward">→</button><button data-action="reload">↻</button><button data-action="home">⌂</button></div><form id="url-form" class="row"><input id="url" placeholder="youtube.com, netflix.com..." autocomplete="off" autocapitalize="none"><button class="primary">Abrir</button></form><div class="quick"><button data-url="https://www.youtube.com/">YouTube</button><button data-url="https://www.netflix.com/">Netflix</button><button data-url="https://www.primevideo.com/">Prime Video</button><button data-url="https://www3.hdfull.one/">HDFull</button></div><div class="twocol"><button id="toggle-fullscreen" type="button">Pantalla completa</button><button id="close-popups" type="button">Cerrar emergentes</button></div></section>
<section class="card"><div class="heading"><span>Escribir</span><small>haz clic antes en el campo de la TV</small></div><form id="type-form" class="row"><input id="text-input" placeholder="Texto..."><button class="primary">Enviar</button></form><div class="twocol"><button data-key="Backspace">⌫</button><button data-key="Delete">Delete</button></div></section>
<section class="card"><div class="heading"><span>Joystick</span><small>desplaza y mantén</small></div><div class="joystick-area"><div id="joystick" class="joystick" aria-label="Joystick para mover el cursor"><span class="joystick-hint joystick-up">↑</span><span class="joystick-hint joystick-right">→</span><span class="joystick-hint joystick-down">↓</span><span class="joystick-hint joystick-left">←</span><div id="joystick-knob" class="joystick-knob"></div></div></div><div class="twocol"><button id="left-click">Clic</button><button id="right-click">Clic derecho</button></div><div class="twocol"><button id="scroll-up">↑ Scroll</button><button id="scroll-down">↓ Scroll</button></div></section>
<section class="card"><div class="heading"><span>Navegación</span><small>teclado</small></div><div class="dpad"><button class="up" data-key="ArrowUp">↑</button><button class="left" data-key="ArrowLeft">←</button><button class="ok" data-key="Enter">OK</button><button class="right" data-key="ArrowRight">→</button><button class="down" data-key="ArrowDown">↓</button></div><div class="threecol"><button data-key="Escape">Esc</button><button data-key="Space">Play / Pause</button><button data-key="Tab">Tab</button></div></section>
<section class="card"><div class="heading"><span>Volumen</span><small>sonido del sistema</small></div><div class="threecol"><button data-key="VolumeDown">Vol −</button><button data-key="VolumeMute">Silencio</button><button data-key="VolumeUp">Vol +</button></div></section>

<section class="card"><div class="heading"><span>Chrome</span><button id="refresh-status" class="link">Actualizar</button></div><div id="page-title" class="title">—</div><div id="page-url" class="url">—</div></section><p id="message" class="message"></p>
</main><script src="/static/js/remote.js?v=fullscreen-1"></script></body></html>
